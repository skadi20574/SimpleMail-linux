appId: com.simplemail.app
productName: SimpleMail
copyright: SimpleMail — MIT licensed. No third-party commercial software assets are used.

directories:
  output: release
  buildResources: build

# 只打包编译产物与运行期依赖，避免把开发工具链带进安装包
files:
  - out/**
  - package.json
  - '!out/dev'
  - '!**/*.map'
  - '!**/*.ts'

asar: true
compression: maximum
# MIT 的条件之一是「版权声明与许可声明须随本软件的所有副本一起分发」，
# 而 .deb / AppImage / tar.gz 都是「副本」—— 所以把两份声明放进 resources/，
# 让它们跟着每一种安装形态一起走。
# （.deb 另外还有 /usr/share/doc/simplemail/copyright，见 build/linux/after-build.cjs）
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE.md
    to: NOTICE.md
# 给可执行文件套一层 shell 启动器，按 chrome-sandbox 权限自适应决定是否关闭沙箱
afterPack: build/linux/after-pack.cjs
# 往 .deb 里塞 AppStream 元数据（GNOME 软件中心读它，见脚本内注释）
afterAllArtifactBuild: build/linux/after-build.cjs
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

linux:
  icon: build/icon.png
  target:
    - deb
    - AppImage
    # tar.gz 作为第三形态：完全不依赖 FUSE、不需要安装，
    # 解压后直接运行 ./SimpleMail，在 Ubuntu 24.04+ 上比 AppImage 更省事
    - tar.gz
  # ⚠️ 分类只能写在这里。electron-builder 的 LinuxTargetHelper.js 第 157 行会
  # 在铺开 desktop 键值对**之后**用这个字段无条件覆盖 desktop.Categories：
  #
  #     ...targetSpecificOptions.desktop,          // 先铺开我们的键值对
  #     desktopMeta.Categories = `${category}...`  // 再被这一行覆盖掉
  #
  # 所以之前写在 desktop 下的 Categories 是被静默丢弃的，生成的 desktop 文件里
  # 只有 Network; —— 应用菜单里也就归不到「邮件」。
  #
  # 这里是 Network;Email; 而不是 Network;Email;Office;：
  # desktop 规范里 Network / Office **都是主分类**，同时出现两个主分类时
  # desktop-file-validate 会提示「might appear more than once in the application
  # menu」—— 应用菜单里会重复出现两个条目。Email 是 Network 下的附加分类，
  # 所以 Network;Email; 既能归到「邮件」又只有一个主分类（Thunderbird 用的
  # 就是 Network;Email;News;）。改这个值前先用 desktop-file-validate 验一遍。
  category: Network;Email;
  maintainer: SimpleMail <simplemail@localhost>
  # ⚠️ synopsis / description 一律用 **ASCII 英文**。
  #
  # 踩过的坑：这两个字段会进 deb control，而 GNOME 软件中心在没有 AppStream
  # 元数据时会回退到它，那条链路上非 ASCII 字符会被丢成「?」——
  # 表现为双击 .deb 时描述显示成一串问号。中文描述改由两处提供：
  #   · AppStream 元数据（build/linux/simplemail.metainfo.xml，软件中心读它）
  #   · .desktop 的 Comment[zh_CN]（应用菜单读它）
  #
  # 另外这里必须是**单行**：electron-builder 会把 description 直接写进 .desktop
  # 的 Comment=，而 desktop 文件不允许续行值，多行会让整个启动项非法。
  synopsis: Local-first desktop email client
  description: Local-first desktop email client with permanent local storage and Foxmail archive support
  # 注意：electron-builder 的 linux.desktop 要的是**扁平键值对**，
  # 不能再套一层 `entry:` —— 写成嵌套会在 .desktop 里生成一行非法的
  # `entry=[object Object]`，导致 GNOME 直接忽略整个启动项（图标就不见了）。
  desktop:
    Name: SimpleMail
    GenericName: Mail Client
    # 注意：不要在这里写 Comment —— 它会被 linux.description 覆盖。
    # 但带 [zh_CN] 后缀的是另一个键，不会被覆盖，中文界面下优先用它。
    Comment[zh_CN]: 本地优先的邮件客户端，支持 Foxmail 存档导入导出
    GenericName[zh_CN]: 邮件客户端
    # 这里**不要**写 Categories —— 它会被 linux.category 覆盖（原因见上面那段注释），
    # 写了也只会让人以为生效了。分类统一在 linux.category 里维护。
    Keywords: email;mail;imap;pop3;smtp;
    Keywords[zh_CN]: 邮件;邮箱;Foxmail;收发;
    StartupWMClass: SimpleMail

deb:
  # 兼容 Ubuntu 22.04 / 24.04 / 26.04：旧包名在 t64 过渡后仍作为 Provides 存在
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - libgbm1
    - libasound2
    - libuuid1
  artifactName: ${productName}_${version}_${arch}.deb
  # ⚠️ 实测：不要在这里写 description。electron-builder 在生成 deb 的
  # .desktop 时会用 deb.description 去覆盖 Comment=，多行值同样会让启动项非法。
  # 长描述改放在程序「设置 → 关于」页里，deb 只保留 linux.description 那一条单行说明。
  # 安装后修正 chrome-sandbox 权限，保证不依赖 --no-sandbox 也能启动
  afterInstall: build/linux/after-install.sh

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage
